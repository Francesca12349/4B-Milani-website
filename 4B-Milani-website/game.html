<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tris - Il Mio Sito Web</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
    <header>
<nav class="navbar">
<a href="index.html">Home</a>
<a href="game.html" class="active">Gioco</a>

<h1>Il gioco del TRIS</h1>
<h2>ecco dove puoi giocare a tris</h2>
<div class="hero-container">
<img src="fototris.jpg" alt="Gioco del tris" class="hero-image">
</div>
</header>

<main>
<article class="game-block">
<h3>Inizia a giocare</h3>
        </style>

        <script>
            let currentSymbol = "X";
            let trisMatrix = [
                [null, null, null],
                [null, null, null],
                [null, null, null]
            ];
            let isGameOver = false;

            function setSymbol(i, j) {
                
                let cellId = 'cell-' + i + '-' + j;
               
                let clickedCell = document.getElementById(cellId);
                
                clickedCell.innerHTML = currentSymbol;

                trisMatrix[i][j] = currentSymbol;

                clickedCell.disabled = true;

                check();

                if(hasEmptyCells() == false && isGameOver == false) {
                    isGameOver = true;
                    alert("Pareggio!");
                }

                if(currentSymbol === 'X') {
                    currentSymbol = 'O';
                }
                else {
                    currentSymbol = 'X';
                }
            }

            function hasEmptyCells() {
                for(let i = 0; i < 3; i++) {
                    for(let j = 0; j < 3; j++) {
                        if(trisMatrix[i][j] == null) {
                            return true;
                        }
                    }
                }
                return false;
            }

            function check() {
                let cond1 = currentSymbol === trisMatrix[0][0] && trisMatrix[0][0] === trisMatrix[0][1] && trisMatrix[0][1] === trisMatrix[0][2];

                let cond2 = currentSymbol === trisMatrix[1][0] && trisMatrix[1][0] === trisMatrix[1][1] && trisMatrix[1][1] === trisMatrix[1][2];

                let cond3 = currentSymbol === trisMatrix[2][0] && trisMatrix[2][0] === trisMatrix[2][1] && trisMatrix[2][1] === trisMatrix[2][2];

                let cond4 = currentSymbol === trisMatrix[0][0] && trisMatrix[0][0] === trisMatrix[1][0] && trisMatrix[1][0] === trisMatrix[2][0];

                let cond5 = currentSymbol === trisMatrix[0][1] && trisMatrix[0][1] === trisMatrix[1][1] && trisMatrix[1][1] === trisMatrix[2][1];

                let cond6 = currentSymbol === trisMatrix[0][2] && trisMatrix[0][2] === trisMatrix[1][2] && trisMatrix[1][2] === trisMatrix[2][2];

                let cond7 = currentSymbol === trisMatrix[0][0] && trisMatrix[0][0] === trisMatrix[1][1] && trisMatrix[1][1] === trisMatrix[2][2];

                let cond8 = currentSymbol === trisMatrix[0][2] && trisMatrix[0][2] === trisMatrix[1][1] && trisMatrix[1][1] === trisMatrix[2][0];

                if(cond1 || cond2 || cond3 || cond4 || cond5 || cond6 || cond7 || cond8) {
                    alert(currentSymbol + ' vince!');
                    isGameOver = true;
                }
            }

        </script>
    </head>
    <body>
        <div class="container">
            <div class="square">
                <div class="row">
                    <button id="cell-0-0" class="cell" onclick="setSymbol(0, 0)"></button>
                    <button id="cell-0-1" class="cell" onclick="setSymbol(0, 1)"></button>
                    <button id="cell-0-2" class="cell" onclick="setSymbol(0, 2)"></button>
                </div>
                <div class="row">
                    <button id="cell-1-0" class="cell" onclick="setSymbol(1, 0)"></button>
                    <button id="cell-1-1" class="cell" onclick="setSymbol(1, 1)"></button>
                    <button id="cell-1-2" class="cell" onclick="setSymbol(1, 2)"></button>
                </div>
                <div class="row">
                    <button id="cell-2-0" class="cell" onclick="setSymbol(2, 0)"></button>
                    <button id="cell-2-1" class="cell" onclick="setSymbol(2, 1)"></button>
                    <button id="cell-2-2" class="cell" onclick="setSymbol(2, 2)"></button>
                </div>
            </div>
        </div>
        <script sce="js/game.js"></script>

    </body>
</html>
